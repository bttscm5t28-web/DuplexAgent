# Tool agent against the scripted mock server: python experiments/slow/mock_llm.py --port 8090
# Swap any module by changing `impl` (see `python -m duplexagent list`), or on the CLI:
#   --set asr.impl=funasr --set asr.model=paraformer-zh-streaming

[engine]
fusion_tick_ms = 50
drain_timeout = 15.0
cancel_on_resume = true

[plugins]
modules = []  # extra modules that register plugins, e.g. ["experiments.asr.funasr_plugin"]

[input]
impl = "sim"
scenario = "scenarios/basic.toml"

[output]
impl = "sim"

[asr]
impl = "mock"
endpoint_ms = 160

[turn]
impl = "rule"
eot_silence_ms = 500
barge_in_ms = 300

[fast]
impl = "rule"
think_ms = 150

[slow]
impl = "agent"
base_url = "http://127.0.0.1:8090/v1"
model = "scripted"

[tts]
impl = "mock"
chars_per_sec = 6.0
first_chunk_ms = 80

[fusion]
impl = "idle"
idle_ms = 800
