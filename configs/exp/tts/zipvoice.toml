# TTS candidate: sherpa-onnx ZipVoice-Distill int8 zh+en (zero-shot voice cloning, flow matching, 24 kHz).
# Only [tts] differs from configs/default.toml. Model: python experiments/tts/download.py zipvoice
[engine]
fusion_tick_ms = 50
drain_timeout = 15.0
cancel_on_resume = true

[plugins]
modules = []

[input]
impl = "sim"
scenario = "scenarios/basic.toml"

[output]
impl = "sim"

[asr]
impl = "mock"
endpoint_ms = 160

[turn]
impl = "rule"
eot_silence_ms = 500
barge_in_ms = 300

[fast]
impl = "rule"
think_ms = 150

[slow]
impl = "mock"
delay_s = 3.0

[fusion]
impl = "idle"
idle_ms = 800

[tts]
impl = "sherpa"
preset = "zipvoice"
model_root = "models/tts"
num_threads = 4
prompt_wav = "models/third_party/CosyVoice/asset/zero_shot_prompt.wav"  # Apache-2.0 asset from the CosyVoice repo (clean studio prompt)
prompt_text = "希望你以后能够做的比我还好呦。"
