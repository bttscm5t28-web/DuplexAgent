# TTS candidate: CosyVoice 2 (0.5B, zero-shot) served out-of-process by experiments/tts/servers/cosyvoice_server.py,
# reached through the OpenAI-compatible openai_speech plugin. Only [tts] differs from configs/default.toml.
[engine]
fusion_tick_ms = 50
drain_timeout = 15.0
cancel_on_resume = true

[plugins]
modules = []

[input]
impl = "sim"
scenario = "scenarios/basic.toml"

[output]
impl = "sim"

[asr]
impl = "mock"
endpoint_ms = 160

[turn]
impl = "rule"
eot_silence_ms = 500
barge_in_ms = 300

[fast]
impl = "rule"
think_ms = 150

[slow]
impl = "mock"
delay_s = 3.0

[fusion]
impl = "idle"
idle_ms = 800

[tts]
impl = "openai_speech"
base_url = "http://127.0.0.1:8091/v1"
model = "cosyvoice2"
voice = "default"
response_format = "pcm"
sample_rate = 24000
timeout = 120.0
