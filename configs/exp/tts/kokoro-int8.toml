# TTS candidate: sherpa-onnx Kokoro-82M v1.1-zh multi-lang int8, bilingual.
# Only [tts] differs from configs/default.toml. Model: python experiments/tts/download.py kokoro-int8
[engine]
fusion_tick_ms = 50
drain_timeout = 15.0
cancel_on_resume = true

[plugins]
modules = []

[input]
impl = "sim"
scenario = "scenarios/basic.toml"

[output]
impl = "sim"

[asr]
impl = "mock"
endpoint_ms = 160

[turn]
impl = "rule"
eot_silence_ms = 500
barge_in_ms = 300

[fast]
impl = "rule"
think_ms = 150

[slow]
impl = "mock"
delay_s = 3.0

[fusion]
impl = "idle"
idle_ms = 800

[tts]
impl = "sherpa"
preset = "kokoro-int8"
model_root = "models/tts"
num_threads = 4
sid = 3  # zf_001; voices are sorted by name: 0-2 English, 3-57 zf_*, 58-102 zm_*
