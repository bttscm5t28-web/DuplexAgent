# TTS candidate: sherpa-onnx Matcha-TTS zh+en (icefall, 16 kHz vocos). Only [tts] differs from default.toml.
# Model: python experiments/tts/download.py matcha-zh-en
[engine]
fusion_tick_ms = 50
drain_timeout = 15.0
cancel_on_resume = true

[plugins]
modules = []

[input]
impl = "sim"
scenario = "scenarios/basic.toml"

[output]
impl = "sim"

[asr]
impl = "mock"
endpoint_ms = 160

[turn]
impl = "rule"
eot_silence_ms = 500
barge_in_ms = 300

[fast]
impl = "rule"
think_ms = 150

[slow]
impl = "mock"
delay_s = 3.0

[fusion]
impl = "idle"
idle_ms = 800

[tts]
impl = "sherpa"
preset = "matcha-zh-en"
model_root = "models/tts"
num_threads = 2
