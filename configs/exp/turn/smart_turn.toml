# 候选：smart_turn —— Silero VAD + Pipecat Smart Turn v3.2（BSD-2，音频 EOT，CPU ~55 ms/次）+ adaptive 的打断判别。
# 由 experiments/turn/make_configs.py 基于 configs/default.toml 生成，只改 [turn]。

[engine]
fusion_tick_ms = 50
drain_timeout = 15.0
cancel_on_resume = true

[plugins]
modules = []  # extra modules that register plugins, e.g. ["experiments.asr.funasr_plugin"]

[input]
impl = "sim"
scenario = "scenarios/basic.toml"

[output]
impl = "sim"

[asr]
impl = "mock"
endpoint_ms = 160

[turn]
impl = "smart_turn"
vad = "silero"
eot = ["smart_turn"]
min_silence_ms = 200
max_silence_ms = 1500
base_silence_ms = 500
p_low = 0.2
p_high = 0.7
audio_probe_ms = 100
hangover_ms = 60
barge_in_ms = 300
barge_in_max_ms = 700

[fast]
impl = "rule"
think_ms = 150

[slow]
impl = "mock"
delay_s = 3.0

[tts]
impl = "mock"
chars_per_sec = 6.0
first_chunk_ms = 80

[fusion]
impl = "idle"
idle_ms = 800
