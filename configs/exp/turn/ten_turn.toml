# 候选：ten_turn —— Silero VAD + TEN Turn Detection（Qwen2.5-7B 微调，Apache-2.0 附加条款）Q4_K_M GGUF / llama.cpp CPU。
# 由 experiments/turn/make_configs.py 基于 configs/default.toml 生成，只改 [turn]。

[engine]
fusion_tick_ms = 50
drain_timeout = 15.0
cancel_on_resume = true

[plugins]
modules = []  # extra modules that register plugins, e.g. ["experiments.asr.funasr_plugin"]

[input]
impl = "sim"
scenario = "scenarios/basic.toml"

[output]
impl = "sim"

[asr]
impl = "mock"
endpoint_ms = 160

[turn]
impl = "ten_turn"
vad = "silero"
eot = ["ten_turn"]
min_silence_ms = 200
max_silence_ms = 2000
base_silence_ms = 500
p_low = 0.15
p_high = 0.75
hangover_ms = 60
barge_in_ms = 300
barge_in_max_ms = 700

[fast]
impl = "rule"
think_ms = 150

[slow]
impl = "mock"
delay_s = 3.0

[tts]
impl = "mock"
chars_per_sec = 6.0
first_chunk_ms = 80

[fusion]
impl = "idle"
idle_ms = 800
