# 由 experiments/turn/prepare_data.py 从 scenarios/basic.toml 生成（真实语音版，wav 不入库）。
# Plain turn-taking: two short user turns, agent answers each.
name = "basic"
duration = 9.62

[[turns]]
at = 0.5
text = "你好"
wav = "experiments/turn/data/wav/basic_0.wav"

[[turns]]
at = 5.0
text = "你是谁"
wav = "experiments/turn/data/wav/basic_1.wav"

[expect]
turns_detected = 2
said_contains = ["有什么可以帮你", "语音助手"]
max_latency_p50 = 1.2
