[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplexagent"
version = "0.1.0"
description = "Pluggable full-duplex voice engine with a fast brain and an async slow brain"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27"]
live = ["sounddevice>=0.4", "numpy>=1.24", "websockets>=13"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["duplexagent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments"]

[tool.setuptools.package-data]
"duplexagent.plugins.io" = ["static/*.html"]
